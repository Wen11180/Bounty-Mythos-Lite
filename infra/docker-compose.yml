services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bounty_mythos
      POSTGRES_USER: bounty
      POSTGRES_PASSWORD: bounty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bounty -d bounty_mythos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../apps/api
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://bounty:bounty@postgres:5432/bounty_mythos
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://bounty:bounty@postgres:5432/bounty_mythos
      REDIS_URL: redis://redis:6379/0
      STUDIO_WEB_ORIGIN: http://127.0.0.1:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PROGRAM_RULE_AI_PROVIDER: ${PROGRAM_RULE_AI_PROVIDER:-}
      PROGRAM_RULE_AI_MODEL: ${PROGRAM_RULE_AI_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bounty:bounty@postgres:5432/bounty_mythos
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: ../apps/api
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bounty:bounty@postgres:5432/bounty_mythos
      REDIS_URL: redis://redis:6379/0
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../apps/web
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  celery_beat_data:
