name: bounty-autopilot-lab-gate

on:
  pull_request:
  push:
    paths:
      - "apps/api/**"
      - "apps/studio/**"
      - "apps/web/**"
      - "infra/**"
      - "docs/BOUNTY_AUTOPILOT_LAB.md"
      - ".github/workflows/bounty-autopilot-lab-gate.yml"

jobs:
  lab-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m venv ../../.venv
          . ../../.venv/bin/activate
          pip install -r requirements.txt -q
      - name: Autopilot pure + durable tests
        working-directory: apps/api
        run: |
          . ../../.venv/bin/activate
          python -m pytest tests/test_bounty_autopilot_*.py tests/test_migrations.py -q
      - name: Clean database migration check
        working-directory: apps/api
        run: |
          . ../../.venv/bin/activate
          database_path="$RUNNER_TEMP/bounty-mythos-migration-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          export DATABASE_URL="sqlite:///$database_path"
          python -m alembic upgrade head
          python -m alembic check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Studio deps
        working-directory: apps/studio
        run: npm ci
      - name: Studio Autopilot unit tests
        working-directory: apps/studio
        run: npm test
      - name: Install Web deps
        working-directory: apps/web
        run: npm ci
      - name: Web unit, lint, and build
        working-directory: apps/web
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run check:bundle
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Web Autopilot E2E
        working-directory: apps/web
        run: npx playwright test --project=chromium
      - name: Compose config
        run: docker compose -f infra/docker-compose.yml config --quiet
