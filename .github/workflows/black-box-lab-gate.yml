name: black-box-lab-gate

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/black-box-lab-gate.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/black-box-lab-gate.yml"

jobs:
  black-box:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
      - name: Black-box unit tests
        run: python -m pytest -k black_box -q --tb=line
      - name: Golden gate
        run: python -m app black-box-golden --all --out-dir tmp/bb-golden
      - name: Leadership gate
        run: python -m app black-box-leadership-gate --out tmp/bb-leadership.json
